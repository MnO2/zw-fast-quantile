on: [push, pull_request]

name: Benchmark

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmark
        run: |
          cargo bench --all-features --bench zw_benchmark -- --output-format bencher
