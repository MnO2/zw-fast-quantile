[package]
name = "zw-fast-quantile"
version = "0.2.3"
repository = "https://github.com/MnO2/zw-fast-quantile"
license = "Apache-2.0"
description = "Zhang-Wang fast quantile algorithm in Rust"
authors = ["Paul Meng <me@paulme.ng>"]
readme = "README.md"
keywords = ["quantile", "statistics"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
quantiles = "0.7.1"
rand_distr = "0.5"
ordered-float = "4"
stats_alloc = "0.1.8"
serde_json = "1"

[[bench]]
name = "zw_benchmark"
harness = false
path = "./benches/zw_benchmark.rs"
required-features = []
